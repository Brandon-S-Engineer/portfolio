# El free tier de Render duerme el servicio tras 15 min sin tráfico. Solo es
# respaldo: GitHub retrasa los crons frecuentes (en la práctica corre cada
# 4–7 h). El ping real es un monitor externo cada 5 min (UptimeRobot); 750 h
# gratis/mes alcanzan para 24/7. El servicio cierra sus conexiones a Postgres
# tras 60 s sin uso, así que estar despierto no mantiene despierto a Neon.
name: keep-lead-agent-warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://volt-lead-agent.onrender.com/health
